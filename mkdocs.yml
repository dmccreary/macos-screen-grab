      - 2. Feature Usage and the 95/5 Rule: chapters/02-feature-usage/index.md
      - 3. Licenses, Subscriptions, and Vendor Incentives: chapters/03-licenses-subscriptions/index.md
      - 4. Total Cost of Ownership: chapters/04-total-cost-of-ownership/index.md
      - 5. Generative AI and Coding Agents: chapters/05-generative-ai-coding-agents/index.md
      - 6. Build or Buy and the Rise of Personal Software: chapters/06-build-or-buy/index.md
      - 7. Requirements and Minimal Specifications: chapters/07-requirements-minimal-specs/index.md
      - 8. Software Design and Platform Constraints: chapters/08-software-design-platform/index.md
      - 9. Generating, Building, and Installing the Code: chapters/09-generating-building-installing/index.md
      - 10. Tokens, Prompt Caching, and Token Pricing: chapters/10-tokens-caching-pricing/index.md
      - "11. Measuring an AI Session: Time and Cost": chapters/11-measuring-ai-session/index.md
      - "12. Software Testing: Automated and Manual": chapters/12-software-testing/index.md
