<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Long Tail of Feature Usage Explorer</title>
  <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    #t-slider { width: 220px; vertical-align: middle; }
    #count { font-size: 16px; }
    #count strong { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>Long Tail of Feature Usage Explorer</h1>
    <span class="badge">Illustrative values, no real product measured</span>
  </header>

  <p class="prompt">How many features do most users really use?</p>

  <div class="panel">
    <div class="row">
      <label for="t-slider">Usage threshold <strong id="t-value">50</strong>% of users</label>
      <input type="range" id="t-slider" min="1" max="100" step="1" value="50">
      <span id="count">Counted: <strong id="count-value">2 of 20 (10%)</strong></span>
    </div>
  </div>

  <div class="chart-box" style="height:430px;">
    <canvas id="chart" aria-label="Horizontal bar chart of 20 features sorted by the share of users who use each one"></canvas>
  </div>

  <div class="panel" style="margin-top:8px;">
    <div class="row">
      <button id="start-btn">Start challenges</button>
      <span id="case-label" class="hidden" style="font-weight:600;"></span>
      <label id="answer-wrap" class="hidden">Features
        <input type="number" id="answer" step="1" min="0" max="20" inputmode="numeric">
      </label>
      <button id="check-btn" class="hidden">Check</button>
      <button id="next-btn" class="hidden">Next challenge</button>
      <span class="score" id="score">Correct: 0 of 3</span>
    </div>
  </div>

  <div class="feedback" id="feedback">Drag the threshold. Bars that reach it are counted. Then press Start challenges.</div>

  <script src="usage-long-tail-explorer.js"></script>
</body>
</html>
