<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Fork and Pull Request Flow</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="diagram-panel">
            <div id="diagram" aria-label="Flowchart of a contribution through a fork and a pull request, six steps"></div>
        </div>
        <div class="info-panel">
            <div id="question" class="question"></div>
            <div id="card" class="card" aria-live="polite"></div>
            <div id="note" class="note" hidden></div>
            <div class="footer">
                <span id="score"></span>
                <button id="reset" type="button">Reset</button>
            </div>
        </div>
    </div>
    <script src="fork-and-pull-request-flow.js"></script>
</body>
</html>
