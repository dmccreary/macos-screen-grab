<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenGrab Component Map — Interactive Diagram</title>
  <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
  <link rel="stylesheet" href="../shared-libs/style.css">
  <style>
    #path-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #path-layer line { stroke: #1a3a6c; stroke-width: 7; }
    #path-layer marker path { fill: #1a3a6c; }
    body.tracing #leaders-svg { visibility: hidden; }
    #sim-caption { margin-left: auto; font-size: 13px; color: #555; }
    #trace-choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    #trace-choices:empty { display: none; }
    #trace-choices .mode-btn:disabled { opacity: 1; }
    #trace-choices .mode-btn.right { background: #2A8040; border-color: #2A8040; color: white; }
    #trace-choices .mode-btn.wrong { background: #B03A2E; border-color: #B03A2E; color: white; }
  </style>
</head>
<body>

<div id="layout">
  <svg id="leaders-svg"></svg>

  <div id="diagram-wrapper">
    <img id="diagram-img" src="component-map-illustration.png" alt="Seven illustrated software components arranged in a ring, with no connections drawn" draggable="false">
    <svg id="path-layer" viewBox="0 0 1200 900" aria-hidden="true">
      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 Z"></path>
        </marker>
      </defs>
    </svg>
    <div id="markers-layer"></div>
  </div>

  <div id="label-panel">
    <!-- label rows injected by diagram.js -->
  </div>
</div>

<div id="controls">
  <button class="mode-btn active" id="btn-explore" onclick="sim.setMode('explore')">Explore</button>
  <button class="mode-btn"        id="btn-quiz"    onclick="sim.setMode('quiz')">Predict</button>
  <span id="quiz-score" style="display:none">
    Correct: <strong id="score-val">0</strong> of <strong id="score-total">6</strong>
  </span>
  <span id="sim-caption">Simplified and illustrative, not the source code layout.</span>
</div>

<div id="infobox">
  <div id="infobox-prompt">Hover over a numbered marker or a label to read what that component does. Press Predict to trace one grab.</div>
  <div id="infobox-content">
    <div id="infobox-label"></div>
    <div id="infobox-desc"></div>
    <div id="trace-choices"></div>
    <div id="infobox-ap-tip"></div>
    <button id="quiz-restart" onclick="sim.restartQuiz()">Try Again</button>
  </div>
</div>

<div id="edit-panel">
  <h3>Edit Mode — drag markers to calibrate positions</h3>
  <div id="coord-display">Drag a marker to see its live coordinates.</div>
  <textarea id="json-output" readonly spellcheck="false"></textarea>
  <div id="edit-actions">
    <button id="copy-json-btn" onclick="sim.copyJSON()">Copy JSON</button>
    <span id="copy-confirm"></span>
  </div>
</div>

<script src="../shared-libs/diagram.js"></script>
<script src="screengrab-component-map.js"></script>
</body>
</html>
