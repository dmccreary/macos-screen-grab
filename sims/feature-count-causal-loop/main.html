<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Feature Count Causal Loop Diagram</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div id="edit-bar" hidden>
            <span class="edit-tag">Edit mode</span>
            <button type="button" id="copy-btn" class="btn">Copy JSON</button>
            <button type="button" id="download-btn" class="btn">Download JSON</button>
            <button type="button" id="reset-btn" class="btn secondary">Reset Layout</button>
            <span class="sep"></span>
            <span class="edge-tools-label">Selected edge:</span>
            <button type="button" id="flip-btn" class="btn secondary" disabled>Flip Curve</button>
            <button type="button" id="less-btn" class="btn secondary" disabled>Curve &minus;</button>
            <button type="button" id="more-btn" class="btn secondary" disabled>Curve +</button>
            <button type="button" id="straight-btn" class="btn secondary" disabled>Straight</button>
            <span id="edit-status" aria-live="polite"></span>
        </div>
        <div id="network-wrap">
            <div id="network" aria-label="Causal loop diagram with Feature Count at the center, three reinforcing loops, and four balancing loops"></div>
        </div>
        <div id="loop-bar" role="group" aria-label="Choose a feedback loop to trace"></div>
        <section id="details" aria-live="polite"></section>
    </main>
    <script src="feature-count-causal-loop.js"></script>
</body>
</html>
