<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenGrab First Install Size Breakdown</title>
  <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .choices button { background: white; color: #1a3a6c; }
    .choices button:hover:not(:disabled) { background: #e8f0fa; }
    .choices button:disabled { opacity: 1; }
    .choices button.right { background: #1e7a3a; border-color: #1e7a3a; color: white; }
    .choices button.wrong { background: #b03a2e; border-color: #b03a2e; color: white; }
    .choices button.dim { opacity: 0.5; }
    #question { font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>ScreenGrab First Install Size Breakdown</h1>
    <span class="badge">Approximate, from the course description</span>
  </header>

  <p class="prompt">Where did the lines go?</p>

  <div class="row" style="margin-bottom:8px;">
    <span style="font-size:15px;">Show:</span>
    <button id="mode-lines" class="toggle secondary active" aria-pressed="true">Lines</button>
    <button id="mode-share" class="toggle secondary" aria-pressed="false">Share of total (%)</button>
    <span class="note" style="margin:0;">Total: 5,210 lines (the chapter says "about 5,200")</span>
  </div>

  <div class="chart-box" style="height:250px;">
    <canvas id="chart" aria-label="Horizontal bar chart of lines in the four parts of the ScreenGrab first install"></canvas>
  </div>

  <div class="panel" style="margin-top:8px;">
    <div class="row">
      <span id="question">Look at the chart in both modes, then answer four questions.</span>
      <span class="score" id="score">Correct: 0 of 4</span>
    </div>
    <div class="choices" id="choices"></div>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="row">
    <button id="start-btn">Start questions</button>
    <button id="next-btn" class="hidden">Next question</button>
    <button id="restart-btn" class="secondary hidden">Restart questions</button>
  </div>

  <script src="screengrab-first-install-size-breakdown.js"></script>
</body>
</html>
