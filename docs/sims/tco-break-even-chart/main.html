<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Break-Even Chart for a Generated Tool</title>
  <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    #m-slider { width: 200px; vertical-align: middle; }
    .readout { font-size: 15px; }
    .readout strong { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>Break-Even Chart for a Generated Tool</h1>
    <span class="badge">Illustrative values</span>
  </header>

  <p class="prompt">When does the generated tool become cheaper?</p>

  <div class="panel">
    <div class="row">
      <label for="m-slider">Generated tool maintenance <strong id="m-value">1</strong> h/yr</label>
      <input type="range" id="m-slider" min="0" max="4" step="0.5" value="1">
      <label for="zoom">View
        <select id="zoom">
          <option value="10">Years 0 to 10</option>
          <option value="2">Years 0 to 2 (zoom)</option>
        </select>
      </label>
    </div>
    <div class="row readout" style="margin-top:6px;">
      <span>Yearly cost: subscription <strong>$110</strong>, generated <strong id="s-gen">$40</strong></span>
      <span>Break-even: <strong id="be-readout">hidden</strong></span>
    </div>
  </div>

  <div class="chart-box" style="height:300px;">
    <canvas id="chart" aria-label="Line chart of cumulative cost over ten years for a paid subscription and a generated tool"></canvas>
  </div>

  <div class="panel" style="margin-top:8px;">
    <div class="row">
      <button id="start-btn">Start challenges</button>
      <span id="case-label" class="hidden" style="font-weight:600;"></span>
      <label id="answer-wrap" class="hidden">Break-even (years)
        <input type="number" id="answer" step="0.1" min="0" inputmode="decimal">
      </label>
      <button id="check-btn" class="hidden">Check</button>
      <button id="next-btn" class="hidden">Next case</button>
      <span class="score" id="score">Correct: 0 of 3</span>
    </div>
  </div>

  <div class="feedback" id="feedback">Move the maintenance slider to see the crossing point, or press Start challenges.</div>

  <script src="tco-break-even-chart.js"></script>
</body>
</html>
